name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Engine and scene-contract tests
        run: npm test
      - name: Every scene renders deterministically, without errors
        run: npm run check
      - name: Single-file build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: claude-motion-reel
          path: dist/index.html
